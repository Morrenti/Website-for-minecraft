<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Server</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: white;
      text-align: center;
    }

    .box {
      margin-top: 120px;
    }

    h1 {
      font-size: 60px;
      color: #00ff99;
      text-shadow: 0 0 20px #00ff99;
    }

    .ip {
      font-size: 28px;
      background: #222;
      display: inline-block;
      padding: 15px 25px;
      border-radius: 12px;
      margin-top: 20px;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      background: #00ff99;
      cursor: pointer;
      border-radius: 10px;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .btn-donate {
      background: orange;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>MY MINECRAFT SERVER</h1>

    <div class="ip" id="ip">your-ip-here</div>

    <br>

    <button onclick="copyIP()">📋 Скопировать IP</button>
    <button class="btn-donate" onclick="donate()">💰 Донат</button>
  </div>

  <script>
    function copyIP() {
      const ip = document.getElementById("ip").innerText;
      navigator.clipboard.writeText(ip);
      alert("IP скопирован!");
    }

    function donate() {
      alert("Скоро добавим донат магазин 😎");
    }
  </script>

</body>
</html>
